utton><button id="paintUndo">되돌리기</button><button id="paintClear">모두 지우기</button></div><span class="pixel-status" id="paintStatus" aria-live="polite"></span></div></div><div class="pixel-dialog-footer"><button id="paintCancel">취소</button><button class="primary" id="paintSave">✓ 그림 적용하기</button></div></div></dialog><dialog class="lesson-dialog" id="lessonDialog" aria-labelledby="lessonHeading"><div class="lesson-inner"><div class="lesson-top"><span>나의 문학 게임 만들기</span><button class="lesson-close" id="lessonClose" aria-label="수업 안내 닫기">✕</button></div><div id="lessonContent" class="lesson-content"></div><div class="lesson-bottom"><button id="lessonPrev">← 이전</button><span id="lessonCounter" class="notice"></span><button id="lessonNext" class="primary">다음 →</button></div></div></dialog><div class="gameframe" id="gameframe"><div class="gameframe-head"><strong id="gameframeLabel">내 게임 미리보기</strong><button id="closeGame">닫기 ✕</button></div><iframe id="gamePreview" title="생성된 게임 미리보기" sandbox="allow-scripts allow-modals"></iframe></div>

t:['작품 속 인물과 사건을 떠올려요.','게임에 어울리는 캐릭터와 적을 정해요.','직접 해 보고 바꾸며 나만의 게임을 완성해요.']},{tag:'먼저 해보기',title:'홍길동 게임을 먼저 해볼까요?',body:'방향키 또는 WASD로 움직이고, 자동 공격으로 적을 물리쳐요. 경험치를 모으면 강화 카드를 고를 수 있어요.',demo:true},{tag:'게임 제작 순서',title:'노드를 하나씩 추가해요',body:'문학작품 → 스토리 → 캐릭터·몬스터·무기·아이템·강화 카드 → 게임 만들기. 그림 예시를 고르거나 캐릭터를 직접 설명해 보세요.'}];function showLesson(){const p=lessonPages[lessonPage],box=document.querySelector('#lessonContent');box.replaceChildren();const tag=document.createElement('span');tag.className='lesson-tag';tag.textContent=p.tag;box.append(tag);const heading=document.createElement('h2');heading.id='lessonHeading';heading.textContent=p.title;box.append(heading);if(p.body){const text=document.createElement('p');text.textContent=p.body;box.append(text)}if(p.list){const ol=document.createElement('ol');p.list.forEach(item=>{const li=document.createElement('li');li.textContent=item;ol.append(li)});box.append(ol)}if(p.demo){const b=document.createElement('button');b.className='primary';b.textContent='▶ 홍길동 예시 게임 해보기';b.onclick=()=>{lessonDialog.close();openDemo()};box.append(b)}document.querySelector('#lessonPrev').disabled=lessonPage===0;document.querySelector('#lessonNext').textContent=lessonPage===lessonPages.length-1?'제작 시작하기 →':'다음 →';document.querySelector('#lessonCounter').textContent=(lessonPage+1)+' / '+lessonPages.length}function openDemo(){document.querySelector('#gameframeLabel').textContent='홍길동 예시 게임 · 내 설정에는 영향을 주지 않아요';document.querySelector('#gamePreview').srcdoc=makeGame(true);document.querySelector('#gameframe').classList.add('open')}document.querySelector('#quickPlay').onclick=()=>{if(isActive('player')&&['m0','m1','m2'].some(isActive)&&isActive('weapons')){document.querySelector('#gameframeLabel').textContent='내가 만든 게임 미리보기';document.querySelector('#gamePreview').srcdoc=makeGame();document.querySelector('#gameframe').classList.add('open')}else openDemo()};document.querySelector('#lessonHelp').onclick=()=>{lessonPage=0;showLesson();lessonDialog.showModal()};document.querySelector('#lessonClose').onclick=()=>lessonDialog.close();document.querySelector('#lessonPrev').onclick=()=>{lessonPage=Math.max(0,lessonPage-1);showLesson()};document.querySelector('#lessonNext').onclick=()=>{if(lessonPage===lessonPages.length-1){lessonDialog.close();return}lessonPage++;showLesson()};
document.querySelector('#closeGame').onclick=()=>{document.querySelector('#gameframe').classList.remove('open');document.querySelector('#gamePreview').srcdoc=''};function refreshAdd(){const pick=document.querySelector('#nodeType');const choices=defs.filter(d=>!isActive(d.id)&&(!/^w[0-2]$/.test(d.id)||!['w0','w1','w2'].some(isActive))&&(d.id==='story'||d.id==='game'?isActive('story')||d.id==='story':d.parent&&isActive(d.parent)));pick.replaceChildren();choices.forEach(d=>{const option=document.createElement('option');option.value=d.id;option.textContent=d.title;pick.append(option)});document.querySelector('#addNode').disabled=!choices.length;document.querySelector('#status').textContent='만든 노드 '+active.length+'개  ·  필요한 종류를 골라 추가하세요'}function ready(){const missing=[];if(!isActive('player'))missing.push('캐릭터');if(!['m0','m1','m2'].some(isActive))missing.push('몬스터');if(!isActive('weapons'))missing.push('무기');if(missing.length){alert('게임을 만들려면 '+missing.join(', ')+' 노드를 추가해 주세요.');return false}return true}document.querySelector('#addNode').onclick=()=>{const id=document.querySelector('#nodeType').value;if(!id)return;active.push(id);saveActive();select(id);arrange()};select('work');requestAnimationFrame(arrange);
</script></body></html>
